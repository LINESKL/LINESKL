# Обновляет карточку активности в cards/. Рендерер Expressive Profile запускается
# в cards/, потому что он перезаписывает README.md и чистит assets/ в своей папке.
name: Profile cards

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  push:
    paths:
      - cards/profile.json

permissions:
  contents: write

concurrency: profile-cards

jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: metawka/expressive-profile
          ref: f852b8a36dc83923d374b2bcba03652338000049 # v1.2.0
          path: .expressive-profile
      - name: Render
        working-directory: cards
        run: node ../.expressive-profile/action/render.mjs
        env:
          GITHUB_TOKEN: ${{ secrets.PROFILE_TOKEN || github.token }}
      - name: Commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add cards
          git diff --cached --quiet || (git commit -m "Обновил карточку активности" && git pull --rebase -q && git push)
